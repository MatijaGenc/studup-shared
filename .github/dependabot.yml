# Dependency update automation for the shared package.
# Yarn 4 is handled by the npm ecosystem. Major updates are intentionally
# left out of every group so each arrives as its own PR; auto-merge is not
# configured here and remains a repository-owner decision.
version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 3
      groups:
          npm-patch:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "patch"
          npm-minor:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 3
      groups:
          actions-patch:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "patch"
          actions-minor:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
