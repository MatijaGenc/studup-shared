name: Secret scan
on:
    push:
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    secret-scan:
        name: Scan tracked files for credentials
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
            - run: node scripts/secret-scan.cjs --all-tracked
