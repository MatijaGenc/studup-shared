name: CI hygiene
on:
    push:
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 8 * * 1"
    workflow_dispatch:
permissions:
    contents: read

concurrency:
    group: hygiene-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    workflow-lint:
        name: Workflow lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: "1.24"
                  cache: false
            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: "1.7.12"
              run: go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
            - name: Lint workflows
              run: |
                  "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

    dependency-audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: yarn
            - run: npm install --global corepack && corepack enable
            - run: corepack prepare yarn@4.18.0 --activate
            - name: Audit production dependencies
              run: yarn npm audit --environment production
