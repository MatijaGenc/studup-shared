name: Validate shared package
on:
    schedule:
        - cron: "37 */2 * * *"
    pull_request:
    workflow_dispatch:
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validation-needed:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Check whether this main revision already passed validation
              id: check
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              with:
                  script: |
                      if (context.eventName !== 'schedule') {
                        core.setOutput('run', 'true');
                        return;
                      }
                      const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                        ...context.repo,
                        workflow_id: 'validate.yml',
                        branch: 'main',
                        head_sha: context.sha,
                        per_page: 100,
                      });
                      for (const run of runs) {
                        if (run.id === context.runId || run.head_sha !== context.sha || run.event === 'pull_request') continue;
                        const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                          ...context.repo,
                          run_id: run.id,
                          filter: 'latest',
                          per_page: 100,
                        });
                        if (jobs.some(job => job.name === 'validate' && job.status === 'completed' && job.conclusion === 'success')) {
                          core.info(`Revision ${context.sha} passed validation in run ${run.id}.`);
                          core.setOutput('run', 'false');
                          return;
                        }
                      }
                      core.setOutput('run', 'true');

    validate:
        needs: validation-needed
        if: needs.validation-needed.outputs.run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - run: npm install --global corepack && corepack enable && corepack prepare yarn@4.18.0 --activate
            - run: yarn install --immutable
            - name: Move shipped output aside before rebuilding
              run: mv dist "$(mktemp -d)"
            - run: yarn check
            - name: Verify committed runtime and declarations match the build
              run: |
                  changes="$(git status --porcelain --untracked-files=all -- dist)"
                  if [ -n "$changes" ]; then
                      printf '%s\n' "$changes"
                      echo "Regenerate dist with yarn build and commit the generated changes."
                      exit 1
                  fi
